# Fixa a versao do Maven usada pelo wrapper. Sem versao explicita na URL, o
# script baixa "apache-maven-3-bin.zip", que nao existe, e o build falha na
# primeira execucao de quem clona.
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
