# Nome do projeto fixo, em vez de herdar o nome da pasta.
#
# Sem isto, quem clonar em um diretorio com outro nome teria uma rede chamada
# de outro jeito, e o comando de testes documentado no README - que passa
# --network - deixaria de funcionar na maquina dessa pessoa.
name: testepratico
services:
  # Sem container_name fixo de proposito. Nome fixo impede rodar duas copias
  # do projeto lado a lado e colide com qualquer container homonimo que ja
  # exista na maquina - cenario real para quem avalia varios testes tecnicos.
  # O Compose nomeia sozinho como testepratico-db-1, ja isolado pelo projeto.
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-teste_pratico}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Sem healthcheck o Postgres aceita conexao antes de estar pronto para
    # consultas e o Flyway falha no primeiro boot.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-teste_pratico}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    # service_healthy, nao apenas service_started: o compose so sobe a API
    # depois que o healthcheck acima passar.
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-teste_pratico}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      # Sem default aqui tambem: se JWT_SECRET nao estiver no .env, o compose
      # para com mensagem explicita em vez de subir com segredo conhecido.
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no arquivo .env (veja .env.example)}
      JWT_EXPIRACAO_MINUTOS: ${JWT_EXPIRACAO_MINUTOS:-120}
      CORS_ORIGENS: ${CORS_ORIGENS:-http://localhost:5173}
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      # Depende do spring-boot-starter-actuator. Sem healthcheck o compose
      # consideraria a API pronta assim que o processo sobe, e o web
      # apareceria antes de o Flyway terminar.
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    build:
      context: ./frontend
      args:
        # Vite injeta VITE_* no bundle em tempo de build. A URL e a que o
        # NAVEGADOR usa, nao a rede interna do compose: o JavaScript roda na
        # maquina de quem abre a pagina, entao "http://api:8080" nao resolveria.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    depends_on:
      api:
        condition: service_healthy
    ports:
      # 5173 no host porque e a origem que o backend libera no CORS
      # (CORS_ORIGENS). Dentro do container o nginx escuta na 80.
      - "${WEB_PORT:-5173}:80"

volumes:
  pgdata:
