server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fallback de single-page application.
    #
    # O roteamento e do React Router, entao /usuarios/3 nao existe como arquivo.
    # Sem o try_files, abrir essa URL direto ou dar F5 nela devolveria 404 do
    # nginx: a rota so funcionaria navegando a partir da raiz.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Os assets levam hash no nome, entao podem ser cacheados sem medo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
